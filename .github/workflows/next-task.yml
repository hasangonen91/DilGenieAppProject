name: Next Task on Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  next-task:
    name: 🚀 Sıradaki göreve geç
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'ai/dev-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      BOT_MODEL: ${{ vars.BOT_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🤖 Sıradaki görevi geliştir
        run: node scripts/ai-dev/ai_dev.mjs