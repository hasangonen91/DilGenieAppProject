name: AI Dev Bot

on:
  schedule:
    # Günde 4 kez (her 6 saatte bir) çalışır — geceleri dahil sürekli üretim
    - cron: '0 */2 * * *'
  workflow_dispatch: # Manuel tetikleme için "Run workflow" butonu

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-dev
  cancel-in-progress: false

jobs:
  develop:
    name: AI ile günlük geliştirme
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      BOT_MODEL: ${{ vars.BOT_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🤖 AI Development Bot
        run: node scripts/ai-dev/ai_dev.mjs