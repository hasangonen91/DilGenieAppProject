name: Kalite Denetimi

on:
  schedule:
    # 6 saatte bir: 00:00, 06:00, 12:00, 18:00 UTC (00:00 UTC reset-öncesi boşluğu doldurur)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    name: 📋 Statik analiz + rapor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Denetim çalıştır
        run: node scripts/audit/audit.mjs

      - name: Değişiklik varsa commit + push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "dilgenie-audit"
            git config user.email "audit@dilgenie.local"
            git add AUDIT.md ROADMAP.md
            git commit -m "audit: kalite denetimi raporu + bulgular" || true
            git push origin main
          else
            echo "Değişiklik yok, push gerekmez."
          fi