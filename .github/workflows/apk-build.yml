name: APK Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    name: Debug APK uret
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Bagimliliklari kur
        run: npm install --legacy-peer-deps

      - name: Debug APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ORG_GRADLE_PROJECT_newArchEnabled: "false"

      - name: APK'yı artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilgenie-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: En son commit'e APK durum yorumu bırak
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="## APK Hazir - Test Et!
          En son AI gelistirmesi ile debug APK derlendi.
          Artifact su sayfadan indir: [Actions - dilgenie-apk](${RUN_URL})"
          gh api -X POST "repos/${{ github.repository }}/commits/${SHA}/comments" \
            -f body="$BODY" 2>/dev/null || true