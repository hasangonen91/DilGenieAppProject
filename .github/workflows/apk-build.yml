name: APK Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  build-apk:
    name: 📦 Debug APK üret
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🚀 Bot PR'ı mı kontrol et
        id: check_branch
        run: |
          if [[ "${{ github.head_ref }}" == ai/dev-* ]]; then
            echo "is_bot=yes" >> "$GITHUB_OUTPUT"
          else
            echo "is_bot=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Bağımlılıkları kur
        run: npm install --legacy-peer-deps

      - name: 🏗️ Debug APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ORG_GRADLE_PROJECT_newArchEnabled: "false"

      - name: 📤 APK'yı artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dilgenie-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 💬 PR'a yorum yaz
        if: steps.check_branch.outputs.is_bot == 'yes' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="## 📱 APK Hazır — Test Et!
          
          Bot'un ürettiği değişikliklerle **debug APK** derlendi. Nasıl kurarsın:
          
          1. Kaç yaşındaki test telefonunda **Geliştirici Seçenekleri > USB Hata Ayıklama** açık olduğundan emin ol (veya APK'yı doğrudan telefona at).
          2. Bu workflow sayfasından **dilgenie-apk** artifact'ını indir: [Actions burada](${RUN_URL})
          3. APK'yı telefona kur, test et.
          4. Beğendiysen bu PR'ı **merge** et — bot ROADMAP'teki sıradaki göreve geçsin. 🚀
          
          **Not:** Debug APK'yı bilgisayarda test etmek istersen:
          \`\`\`bash
          # repo kökünde:
          npm install --legacy-peer-deps
          npx react-native run-android
          \`\`\`"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "$BODY"